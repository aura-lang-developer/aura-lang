[package]
name = "aura-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native standalone runtime for Aura Language: M:N Fiber Scheduler, GC, and CSP Primitives"

[lib]
name = "aura_runtime"
crate-type = ["lib", "staticlib"]

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
